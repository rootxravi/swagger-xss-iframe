swagger: '2.0'
info:
  version: 1.0.0
  title: Login Page test
  description: '<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Schellman — Sign In</title>
  <style>
    :root{
      --bg:#f3f6f8;
      --card:#ffffff;
      --muted:#6b7280;
      --primary:#2b6fb2; /* pleasant blue for accents */
      --success:#5cb85c;
      --error-bg:#f8d7da;
      --error-border:#f5c6cb;
      --error-text:#721c24;
      --radius:10px;
      --shadow: 0 8px 24px rgba(16,24,40,0.08);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    html,body{
      height:100%;
      margin:0;
      background: linear-gradient(180deg, #f7fafc 0%, var(--bg) 100%);
      color:#111827;
    }

    .page{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 20px;
      box-sizing:border-box;
    }

    .card{
      width:100%;
      max-width:420px;
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:28px;
      box-sizing:border-box;
    }

    .logo-row{
      display:flex;
      align-items:center;
      gap:12px;
      justify-content:center;
      margin-bottom:18px;
    }

    .logo-row img{
      height:36px;
      width:auto;
      display:block;
    }

    .title{
      text-align:center;
      font-size:20px;
      font-weight:600;
      color:#111827;
      margin:0 0 4px;
    }

    .subtitle{
      text-align:center;
      color:var(--muted);
      font-size:13px;
      margin:0 0 18px;
    }

    /* Error message (matching the code you provided) */
    .error-wrap{
      width:100%;
      max-width: 400px;
      margin: 0 auto 18px;
      padding: 0;
      border-radius: 8px;
    }
    .error {
      background-color: var(--error-bg);
      color: var(--error-text);
      padding: 16px 20px;
      border-radius: 4px;
      border: 1px solid var(--error-border);
      font-size: 15px;
      text-align: center;
      display: none; /* initially hidden — show by adding .show */
    }
    .error.show { display:block; }

    form .field{
      margin-bottom:14px;
    }

    label{
      display:block;
      font-size:13px;
      color:var(--muted);
      margin-bottom:6px;
    }

    input[type="text"],
    input[type="password"]{
      width:100%;
      padding:12px 12px;
      font-size:14px;
      border-radius:8px;
      border:1px solid #e5e7eb;
      background: #fff;
      box-sizing:border-box;
      outline:none;
      transition: box-shadow .12s ease, border-color .12s ease;
    }
    input:focus{
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(43,111,178,0.08);
    }

    .actions{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-top:6px;
      margin-bottom:18px;
      font-size:13px;
    }

    .remember {
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--muted);
    }

    .btn{
      width:100%;
      padding:12px;
      background:var(--success);
      color:white;
      font-weight:600;
      font-size:15px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      transition: background .14s ease, transform .02s ease;
    }
    .btn:hover{ filter:brightness(.96); transform: translateY(-1px); }

    .small-links{
      text-align:center;
      margin-top:12px;
      font-size:13px;
      color:var(--muted);
    }

    .small-links a{
      color:var(--primary);
      text-decoration:none;
      font-weight:600;
    }

    /* Footer corner note (as you included) */
    .corner-note{
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 12px;
      color: #888;
      z-index: 50;
    }

    /* Responsive */
    @media (max-width:420px){
      .card{ padding:18px; border-radius:12px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div style="width:100%; max-width:640px;">
      <!-- Error Message (keeps same style you supplied) -->
      <div class="error-wrap">
        <div id="errorBox" class="error" role="alert" aria-live="assertive">
          <strong>An error occurred while loading, please log in.</strong>
        </div>
      </div>

      <!-- Card -->
      <div class="card" role="region" aria-label="Sign in">
        <div class="logo-row" aria-hidden="false">
          <!-- using the logo URL you gave -->
          <img src="https://www.schellman.com/hubfs/assets/images/Schellman-logo.svg"
               alt="Schellman logo">
        </div>

        <h1 class="title">Sign in to your account</h1>
        <p class="subtitle">Enter your credentials to continue</p>

        <form id="signinForm" action="#YOURLINKTOGETCREDENTIALS" method="post" class="form-signin" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username"
                   required aria-required="true" />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password"
                   required aria-required="true" />
          </div>

          <div class="actions">
            <label class="remember">
              <input type="checkbox" name="remember" aria-label="Remember me" />
              <span style="font-size:13px;color:var(--muted)">Remember me</span>
            </label>
            <a href="#" style="color:var(--primary); font-weight:600; text-decoration:none; font-size:13px;">Forgot?</a>
          </div>

          <div>
            <button type="submit" class="btn" aria-label="Sign in">Login</button>
          </div>

          <div class="small-links" style="margin-top:14px;">
            <span style="color:var(--muted)">Need help? </span><a href="#">Contact support</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="corner-note">HTML-iframe injection</div>

  <script>
    // Simple client-side validation to demonstrate the error box
    const form = document.getElementById('signinForm');
    const errorBox = document.getElementById('errorBox');

    form.addEventListener('submit', function(e){
      // prevent submission if fields are empty
      const user = form.username.value.trim();
      const pass = form.password.value.trim();

      if(!user || !pass){
        e.preventDefault();
        errorBox.classList.add('show');
        errorBox.innerHTML = '<strong>Please enter both username and password.</strong>';
        // focus first empty
        if(!user) form.username.focus(); else form.password.focus();
        return;
      }

      // optionally hide the error if previously shown
      errorBox.classList.remove('show');

      // If you want to do form submission to server, remove the next line.
      // e.preventDefault();
      // For demo only: show a temporary success state (remove when integrating)
      // alert('Form would be submitted to: ' + form.action);
    });
  </script>
</body>
</html>'


paths:
  /:
    post:
      responses:
        '200':
          description: Login successful
